name: formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    name: point the formula at the new release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the formula for ${{ github.event.release.tag_name }}
        run: bash scripts/update-formula.sh "${{ github.event.release.tag_name }}"

      - name: Commit when the formula changed
        run: |
          set -eu
          if git diff --quiet Formula/osm.rb; then
            echo "the formula already points at this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/osm.rb
          git commit -m "chore(formula): point at ${{ github.event.release.tag_name }} [skip ci]"
          git push origin main
