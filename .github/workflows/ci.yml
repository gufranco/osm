name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHFMT_VERSION: v3.13.1

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the artifact
        run: bash build.sh

      - name: Check formatting
        run: shfmt -d -i 2 lib build.sh install.sh scripts/coverage.sh test

      - name: Lint the artifact
        run: shellcheck --severity=style dist/osm

      - name: Lint the scripts
        run: shellcheck --severity=style --shell=bash build.sh install.sh scripts/coverage.sh

      - name: Lint the tests
        run: shellcheck --severity=style --shell=bash -e SC2154 test/*.bats test/helpers/*.bash

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install age bats-core

      - name: Report the environment
        run: |
          bash --version | head -1
          age --version
          openssl version
          bats --version

      - name: Build the artifact
        run: bash build.sh

      - name: Run the suite
        run: bats --print-output-on-failure test

      - name: Run the suite under the system bash
        if: runner.os == 'macOS'
        run: /bin/bash -c 'bats --print-output-on-failure test'

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y age bats kcov python3 openssh-client openssl curl ca-certificates git

      - uses: actions/checkout@v7

      - name: Build the artifact
        run: bash build.sh

      - name: Enforce the coverage gate
        run: bash scripts/coverage.sh 95

  interop-encrypt:
    name: encrypt on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install age

      - name: Build the artifact
        run: bash build.sh

      - name: Encrypt a message addressed to an ephemeral key
        run: |
          set -euo pipefail
          mkdir -p interop/.ssh interop/served
          ssh-keygen -q -t ed25519 -N '' -C interop -f interop/.ssh/id_ed25519 </dev/null
          awk '{print $1" "$2}' interop/.ssh/id_ed25519.pub > interop/served/alice.keys
          python3 test/helpers/keyserver.py interop/served > interop/port 2>/dev/null &
          for _ in $(seq 1 60); do [ -s interop/port ] && break; sleep 0.1; done
          printf 'interop secret\nacentuacao: cao cedilha\ntrailing line\n' > interop/original.txt
          OSM_GITHUB_BASE="http://127.0.0.1:$(cat interop/port)" HOME="$PWD/interop" \
            ./dist/osm send alice --no-clipboard < interop/original.txt > interop/message.txt
          shasum -a 256 interop/original.txt

      - uses: actions/upload-artifact@v7
        with:
          name: interop-bundle
          path: |
            interop/message.txt
            interop/original.txt
            interop/.ssh/id_ed25519
          include-hidden-files: true
          retention-days: 1

  interop-decrypt:
    name: decrypt on Linux
    runs-on: ubuntu-latest
    needs: interop-encrypt
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Build the artifact
        run: bash build.sh

      - uses: actions/download-artifact@v8
        with:
          name: interop-bundle
          path: interop

      - name: Decrypt the macOS message and compare
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          install -m 0600 interop/.ssh/id_ed25519 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ./dist/osm read interop/message.txt > recovered.txt
          sha256sum recovered.txt interop/original.txt
          cmp recovered.txt interop/original.txt
          echo "macOS to Linux round trip is byte identical"
